spring:
  application:
    name: application-service

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}?currentSchema=application"
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: application

  flyway:
    enabled: true
    default-schema: application
    schemas: application

server:
  port: ${SERVER_PORT:8082}
