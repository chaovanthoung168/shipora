spring:
  application:
    name: application-service

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}?currentSchema=application"
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: application

  flyway:
    enabled: true
    default-schema: application
    schemas: application

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

shipora:
  catalog:
    project-url: ${PROJECT_SERVICE_URL:http://localhost:8081}
    git-url: ${GIT_SERVICE_URL:http://localhost:8084}
  secrets:
    data-directory: ${SHIPORA_APPLICATION_DATA_DIR:./.shipora/application-service}
