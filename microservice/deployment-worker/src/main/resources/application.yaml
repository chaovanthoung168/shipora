spring:
  application:
    name: deployment-worker

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}?currentSchema=deployment"
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: deployment

  # deployment-service owns migrations for this shared schema.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8085}
