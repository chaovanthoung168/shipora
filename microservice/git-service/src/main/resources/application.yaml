spring:
  application:
    name: git-service

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}?currentSchema=git"
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: git

  flyway:
    enabled: true
    default-schema: git
    schemas: git

server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

shipora:
  setup:
    public-url: ${SHIPORA_PUBLIC_URL:http://localhost:8084}
    manifest-callback-url: ${SHIPORA_GITHUB_SETUP_CALLBACK_URL:}
    authorization-callback-url: ${SHIPORA_GITHUB_AUTH_CALLBACK_URL:}
    data-directory: ${SHIPORA_DATA_DIR:./.shipora/git-service}
    webhooks-enabled: ${SHIPORA_GITHUB_WEBHOOKS_ENABLED:false}
  github:
    app-id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    private-key: ${GITHUB_PRIVATE_KEY_PATH:}
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8084/api/git/github/callback}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-version: "2026-03-10"

---
shipora:
  pipeline:
    automatic-push-enabled: ${SHIPORA_AUTO_DEPLOY_ENABLED:false}
