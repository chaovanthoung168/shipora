spring:
  application:
    name: deployment-service

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB}}?currentSchema=deployment"
    username: ${DB_USER:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: deployment

  flyway:
    enabled: true
    default-schema: deployment
    schemas: deployment

server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never

shipora:
  catalog:
    application-url: ${APPLICATION_SERVICE_URL:http://localhost:8082}
    project-url: ${PROJECT_SERVICE_URL:http://localhost:8081}
    git-url: ${GIT_SERVICE_URL:http://localhost:8084}

---
shipora:
  pipeline:
    automatic-push-enabled: ${SHIPORA_AUTO_DEPLOY_ENABLED:false}
