server {
    listen 80;
    client_max_body_size 4m;
    location /internal/ { return 404; }
    location ~ ^/api/applications/[^/]+/releases$ { proxy_pass http://deployment-service:8083; }
    location /api/deployments { proxy_pass http://deployment-service:8083; }
    location /api/applications { proxy_pass http://application-service:8082; }
    location /api/kubernetes-targets { proxy_pass http://application-service:8082; }
    location /api/projects { proxy_pass http://project-service:8081; }
    location /api/servers { proxy_pass http://project-service:8081; }
    location /api/git/ { proxy_pass http://git-service:8084; }
    location = / { default_type application/json; return 200 '{"platform":"Shipora","service":"API"}'; }
    location / { return 404; }
}
