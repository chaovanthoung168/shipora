name: shipora-pipeline
x-api-env: &api-env
  SPRING_PROFILES_ACTIVE: selfhost
  DB_HOST: postgres
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
  DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  SHIPORA_ADMIN_USERNAME: ${SHIPORA_ADMIN_USERNAME:-admin}
  SHIPORA_ADMIN_PASSWORD: ${SHIPORA_ADMIN_PASSWORD:?Set SHIPORA_ADMIN_PASSWORD}
  SHIPORA_ORGANIZATION_ID: ${SHIPORA_ORGANIZATION_ID:?Set SHIPORA_ORGANIZATION_ID}
  LOCAL_WORKER_USERNAME: ${LOCAL_WORKER_USERNAME:-shipora-worker}
  LOCAL_WORKER_PASSWORD: ${LOCAL_WORKER_PASSWORD:?Set LOCAL_WORKER_PASSWORD}
  SHIPORA_AUTOMATION_USERNAME: ${SHIPORA_AUTOMATION_USERNAME:-shipora-automation}
  SHIPORA_AUTOMATION_PASSWORD: ${SHIPORA_AUTOMATION_PASSWORD:?Set SHIPORA_AUTOMATION_PASSWORD}
  PROJECT_SERVICE_URL: http://project-service:8081
  APPLICATION_SERVICE_URL: http://application-service:8082
  GIT_SERVICE_URL: http://git-service:8084
  DEPLOYMENT_SERVICE_URL: http://deployment-service:8083
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    restart: unless-stopped
  project-service:
    image: shipora/project-service:local
    build:
      context: ../..
      dockerfile: infrastructure/pipeline/service.Dockerfile
      args: {SERVICE: project-service}
    environment:
      <<: *api-env
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/shipora/project.yaml
    volumes:
      - ./project.yaml:/run/shipora/project.yaml:ro
      - ./ssh:/run/shipora/ssh:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control, outbound]
    restart: unless-stopped
  application-service:
    image: shipora/application-service:local
    build:
      context: ../..
      dockerfile: infrastructure/pipeline/service.Dockerfile
      args: {SERVICE: application-service}
    environment:
      <<: *api-env
      SHIPORA_APPLICATION_DATA_DIR: /var/lib/shipora/application
    volumes: [application-data:/var/lib/shipora]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control, outbound]
    restart: unless-stopped
  git-service:
    image: shipora/git-service:local
    build:
      context: ../..
      dockerfile: infrastructure/pipeline/service.Dockerfile
      args: {SERVICE: git-service}
    environment:
      <<: *api-env
      SHIPORA_DATA_DIR: /var/lib/shipora/git
      SHIPORA_PUBLIC_URL: ${SHIPORA_PUBLIC_URL:?Set SHIPORA_PUBLIC_URL}
      GITHUB_CALLBACK_URL: ${SHIPORA_PUBLIC_URL}/api/git/github/callback
      SHIPORA_GITHUB_WEBHOOKS_ENABLED: ${SHIPORA_GITHUB_WEBHOOKS_ENABLED:-true}
      SHIPORA_AUTO_DEPLOY_ENABLED: ${SHIPORA_AUTO_DEPLOY_ENABLED:-false}
    volumes: [git-data:/var/lib/shipora]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control, outbound]
    restart: unless-stopped
  deployment-service:
    image: shipora/deployment-service:local
    build:
      context: ../..
      dockerfile: infrastructure/pipeline/service.Dockerfile
      args: {SERVICE: deployment-service}
    environment:
      <<: *api-env
      SHIPORA_AUTO_DEPLOY_ENABLED: ${SHIPORA_AUTO_DEPLOY_ENABLED:-false}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
  buildkit:
    image: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    command: [--addr, unix:///run/user/1000/buildkit/buildkitd.sock, --oci-worker-snapshotter, native]
    security_opt: [seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
    volumes:
      - buildkit-socket:/run/user/1000
      - buildkit-cache:/home/user/.local/share/buildkit
    networks: [build]
    restart: unless-stopped
  deployment-worker:
    image: shipora/deployment-worker:local
    build:
      context: ../..
      dockerfile: infrastructure/pipeline/worker.Dockerfile
    environment:
      SHIPORA_WORKER_ENABLED: ${SHIPORA_WORKER_ENABLED:-false}
      LOCAL_WORKER_USERNAME: ${LOCAL_WORKER_USERNAME:-shipora-worker}
      LOCAL_WORKER_PASSWORD: ${LOCAL_WORKER_PASSWORD}
      PROJECT_SERVICE_URL: http://project-service:8081
      APPLICATION_SERVICE_URL: http://application-service:8082
      GIT_SERVICE_URL: http://git-service:8084
      DEPLOYMENT_SERVICE_URL: http://deployment-service:8083
      SHIPORA_WORKER_WORKSPACE: /var/lib/shipora/worker
      BUILDKIT_HOST: unix:///run/buildkit/buildkit/buildkitd.sock
      SHIPORA_IMAGE_REPOSITORY: ${SHIPORA_IMAGE_REPOSITORY:?Set SHIPORA_IMAGE_REPOSITORY}
      SHIPORA_APPS_DOMAIN: ${SHIPORA_APPS_DOMAIN:-}
      SHIPORA_INGRESS_CLASS: ${SHIPORA_INGRESS_CLASS:-}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/shipora/worker.yaml
    volumes:
      - worker-data:/var/lib/shipora/worker
      - buildkit-socket:/run/buildkit:ro
      - ./worker.yaml:/run/shipora/worker.yaml:ro
      - ./registry:/run/shipora/registry:ro
      - ./ssh:/run/shipora/ssh:ro
    depends_on: [deployment-service, buildkit]
    networks: [control, outbound]
    restart: unless-stopped
  api:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: [./api.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [project-service, application-service, git-service, deployment-service]
    networks: [control, outbound]
    restart: unless-stopped
volumes:
  database:
  application-data:
  git-data:
  worker-data:
  buildkit-socket:
  buildkit-cache:
networks:
  control: {internal: true}
  outbound:
  build:
